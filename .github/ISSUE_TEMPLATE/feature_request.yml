name: Feature request
description: Propose an improvement or new capability
title: "feat: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thanks for proposing an improvement. Please include the user value and constraints.
  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What user problem are you solving?
      placeholder: Describe current pain and impact.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe behavior, config changes, and routing impact.
      placeholder: Describe the desired behavior in detail.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other options you evaluated.
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Testable checklist for completion.
      placeholder: |
        - [ ] Criterion 1
        - [ ] Criterion 2
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-flight checks
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: This request aligns with the functional requirements doc.
          required: false
