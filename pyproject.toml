[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-smart-router"
version = "0.2.0"
description = "Smart routing plugin for Hermes"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Hermes Smart Router Free Use No-Resale License 1.0" }
authors = [
  { name = "Your Name", email = "you@example.com" }
]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: Other/Proprietary License",
  "Operating System :: OS Independent"
]
dependencies = [
  "PyYAML>=6.0.0"
]

[project.scripts]
hermes-smart-router = "hermes_plugin_starter.cli:main"

[project.entry-points."hermes_agent.plugins"]
hermes-smart-router = "hermes_smart_router:register"

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.15.21"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
